{% extends 'base.html' %}
{% load widget_tweaks %}

{% block page_title %}{{ title }}{% endblock %}

{% block content %}
<div class="card p-4 border-0 shadow-sm">
    <form method="post">
        {% csrf_token %}
        {% for field in form %}
            <div class="mb-3">
                <label>{{ field.label }}</label>
                {% render_field field class="form-control" %}
            </div>
        {% endfor %}
        <button type="submit" class="btn btn-primary">Guardar</button>
    </form>
</div>
{% endblock %}
